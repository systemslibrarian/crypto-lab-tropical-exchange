# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. Ungrouped, this fleet reached 1,461 open PRs across 176
# repos, none of which had any CI signal because the only workflow fired on
# push to main.
#
# Majors are deliberately left OUT of the npm group. When the 2026-08-18
# backlog was landed by hand, 109 bumps had to be held back and they were
# overwhelmingly majors: a breaking major inside the grouped PR makes the whole
# thing unmergeable, which is the hand-unpicking this exists to prevent.
#
# github-actions majors ARE grouped: those jumps were verified green across the
# fleet in one pass.
#
# The minor/patch group and the actions group auto-merge once this lab's own
# gate passes on the pull request -- see the dependabot-auto-merge job in
# .github/workflows/deploy.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    # Playwright is PINNED TO THE CI CONTAINER, so it must not move on its own.
    # The gate runs in mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    # and package.json pins @playwright/test to 1.65.1 to match that image's
    # bundled browsers. A Dependabot bump of the npm package alone leaves the
    # container one version behind the test runner, which is a mismatch the gate
    # cannot report as such. Playwright moves only in a deliberate change that
    # bumps the image tag (v1.65.1), its @sha256 digest and this pin together.
    #
    # @axe-core/playwright is deliberately NOT ignored: it tracks axe-core, not the
    # browser build, and nothing about it is pinned to the image.
    ignore:
      - dependency-name: "@playwright/test"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
